openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FitTrack Fitness & Nutrition API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: workouts
    description: Workout operations
  - name: meals
    description: Meal and nutrition operations
  - name: blog
    description: Blog article operations
  - name: profile
    description: User profile operations
  - name: progress
    description: Progress tracking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get currently authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /workouts:
    get:
      operationId: getWorkouts
      tags: [workouts]
      summary: Get all workouts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workout"

  /workouts/{id}/complete:
    post:
      operationId: completeWorkout
      tags: [workouts]
      summary: Mark workout as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workout marked as completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutCompletion"

  /meals:
    get:
      operationId: getMeals
      tags: [meals]
      summary: Get all meals/recipes
      parameters:
        - name: goal
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"
    post:
      operationId: createMeal
      tags: [meals]
      summary: Create a custom meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMeal"
      responses:
        "201":
          description: Meal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"

  /meals/{id}:
    put:
      operationId: updateMeal
      tags: [meals]
      summary: Update a meal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeal"
      responses:
        "200":
          description: Meal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
    delete:
      operationId: deleteMeal
      tags: [meals]
      summary: Delete a meal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Meal deleted

  /meals/diary:
    get:
      operationId: getFoodDiary
      tags: [meals]
      summary: Get food diary entries
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Food diary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaryEntry"
    post:
      operationId: addFoodDiaryEntry
      tags: [meals]
      summary: Add food diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDiaryEntry"
      responses:
        "201":
          description: Diary entry added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"

  /meals/diary/{id}:
    put:
      operationId: updateFoodDiaryEntry
      tags: [meals]
      summary: Update a food diary entry (meal type only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiaryEntry"
      responses:
        "200":
          description: Diary entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
    delete:
      operationId: deleteFoodDiaryEntry
      tags: [meals]
      summary: Delete a food diary entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Diary entry deleted

  /blog:
    get:
      operationId: getBlogArticles
      tags: [blog]
      summary: Get all blog articles
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /blog/{id}/favorite:
    post:
      operationId: toggleArticleFavorite
      tags: [blog]
      summary: Toggle article favorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Favorite toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResult"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get user progress stats
      responses:
        "200":
          description: Progress stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
      required:
        - email
        - password
        - name

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
      required:
        - id
        - email
        - name

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - token
        - user

    Workout:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [strength, cardio, yoga, home]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        duration:
          type: integer
          description: Duration in minutes
        calories:
          type: integer
          description: Estimated calories burned
        imageUrl:
          type: string
        steps:
          type: array
          items:
            type: string
        completed:
          type: boolean
        completionCount:
          type: integer
          description: Number of times this workout has been completed
        videoUrl:
          type: string
          nullable: true
          description: Optional YouTube URL shown on the workout detail page
      required:
        - id
        - title
        - description
        - category
        - difficulty
        - duration
        - calories
        - imageUrl
        - steps
        - completed
        - completionCount

    WorkoutCompletion:
      type: object
      properties:
        workoutId:
          type: integer
        completed:
          type: boolean
        completionCount:
          type: integer
          description: Total number of completions for this workout after the new one was recorded
        pointsEarned:
          type: integer
        totalPoints:
          type: integer
      required:
        - workoutId
        - completed
        - completionCount
        - pointsEarned
        - totalPoints

    Meal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
          enum: [weight-loss, muscle-gain, maintenance]
        calories:
          type: integer
        protein:
          type: number
          nullable: true
        carbs:
          type: number
          nullable: true
        fat:
          type: number
          nullable: true
        imageUrl:
          type: string
          nullable: true
        ingredients:
          type: array
          items:
            type: string
          nullable: true
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
      required:
        - id
        - title
        - calories
        - mealType

    NewMeal:
      type: object
      properties:
        title:
          type: string
        calories:
          type: integer
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        protein:
          type: number
          nullable: true
        carbs:
          type: number
          nullable: true
        imageUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      required:
        - title
        - calories
        - mealType

    UpdateMeal:
      type: object
      properties:
        title:
          type: string
        calories:
          type: integer
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        protein:
          type: number
          nullable: true
        carbs:
          type: number
          nullable: true
        imageUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      required:
        - title
        - calories
        - mealType

    DiaryEntry:
      type: object
      properties:
        id:
          type: integer
        mealId:
          type: integer
        mealTitle:
          type: string
        calories:
          type: integer
        date:
          type: string
        mealType:
          type: string
      required:
        - id
        - mealId
        - mealTitle
        - calories
        - date
        - mealType

    NewDiaryEntry:
      type: object
      properties:
        mealId:
          type: integer
        date:
          type: string
        mealType:
          type: string
      required:
        - mealId
        - date
        - mealType

    UpdateDiaryEntry:
      type: object
      properties:
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        calories:
          type: integer
          minimum: 0

    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        imageUrl:
          type: string
        author:
          type: string
        publishedAt:
          type: string
        tags:
          type: array
          items:
            type: string
        favorited:
          type: boolean
      required:
        - id
        - title
        - excerpt
        - content
        - imageUrl
        - author
        - publishedAt
        - tags
        - favorited

    FavoriteResult:
      type: object
      properties:
        articleId:
          type: integer
        favorited:
          type: boolean
      required:
        - articleId
        - favorited

    Profile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        age:
          type: integer
        weight:
          type: number
        height:
          type: number
        goal:
          type: string
          enum: [weight-loss, muscle-gain, maintenance, endurance]
        avatarUrl:
          type: string
        points:
          type: integer
        level:
          type: integer
        joinedAt:
          type: string
      required:
        - id
        - name
        - email
        - age
        - weight
        - height
        - goal
        - points
        - level
        - joinedAt

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        weight:
          type: number
        height:
          type: number
        goal:
          type: string

    Progress:
      type: object
      properties:
        totalWorkouts:
          type: integer
        completedWorkouts:
          type: integer
        totalCaloriesBurned:
          type: integer
        totalPoints:
          type: integer
        level:
          type: integer
        weeklyStreak:
          type: integer
        weeklyWorkouts:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyWorkout"
        recentAchievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
      required:
        - totalWorkouts
        - completedWorkouts
        - totalCaloriesBurned
        - totalPoints
        - level
        - weeklyStreak
        - weeklyWorkouts
        - recentAchievements

    WeeklyWorkout:
      type: object
      properties:
        day:
          type: string
        count:
          type: integer
        calories:
          type: integer
      required:
        - day
        - count
        - calories

    Achievement:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        earnedAt:
          type: string
      required:
        - id
        - title
        - description
        - icon
        - earnedAt
